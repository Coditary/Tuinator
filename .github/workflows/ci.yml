name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libncursesw-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ncurses

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke tests
        run: ./scripts/test-all.sh

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PDCurses (vcpkg)
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg $env:GITHUB_WORKSPACE/vcpkg
          & $env:GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat
          & $env:GITHUB_WORKSPACE/vcpkg/vcpkg install pdcurses:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DTUINATOR_PDCURSES_ROOT="$env:GITHUB_WORKSPACE/vcpkg/installed/x64-windows"

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
