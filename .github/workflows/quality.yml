name: Quality

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: ./scripts/quality/format-check.sh

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-tidy \
            clang-tools \
            libncurses-dev \
            zlib1g-dev

      - name: Run clang-tidy
        run: ./scripts/quality/clang-tidy.sh

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: ./scripts/quality/cppcheck.sh

  security:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: security-and-quality

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev zlib1g-dev

      - name: Build for analysis
        run: |
          cmake -B build-codeql \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DTUINATOR_BUILD_EXAMPLES=OFF \
            -DTUINATOR_BUILD_TESTS=ON
          cmake --build build-codeql --parallel

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
